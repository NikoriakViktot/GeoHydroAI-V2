# Hetzner staging (2026-10-21): the dump is restored into an empty cluster, so no init scripts; more memory than on AWS.
# nginx runs on the host there (scripts/ops/host_nginx.py), not in this compose project.
services:
  postgis:
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "effective_cache_size=6GB", "-c", "work_mem=16MB", "-c", "maintenance_work_mem=512MB", "-c", "max_connections=120"]
    volumes: !override
      - pgdata:/var/lib/postgresql/data
    networks: !override [web]
    mem_limit: 4g
    memswap_limit: 4g
