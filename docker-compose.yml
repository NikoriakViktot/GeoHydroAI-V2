

# обмеження розміру логів контейнерів (20 МБ × 3 файли на сервіс)
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  # The ONE PostgreSQL/PostGIS instance of the host (server audit 2026-10-13): databases `geohydro` (hydro layers for
  # Martin + geoai-api v1), `platform` (geoai-django) and `course_db` (Python_Curse). The custom image
  # (./services/postgis: pgvector, ogr_fdw, parquet_fdw) no longer builds and none of those extensions was used,
  # so the official image is enough; the data directory is the same PG 16 / PostGIS 3.5 and needs no migration.
  postgis:
    image: postgis/postgis:16-3.5
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=8MB", "-c", "max_connections=120"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/postgis/init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"   # лише локально / через SSH-тунель
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    # python_course: the Python_Curse containers reach this instance as `geoai-postgis-1` on their own network
    networks: [web, python_course]
    logging: *logging
    restart: unless-stopped
    oom_score_adj: -500     # the kernel kills a worker before the database (server audit 2026-10-13)
    mem_limit: 1536m        # three databases: shared_buffers 256 MB + per-connection work_mem
    memswap_limit: 1536m

  terracotta:
    build: ./services/tc_app
    environment:
      COG_DATA_DIR: /app/data/cogs
      TC_DB: /app/tc_db/terracotta.sqlite
      TC_PORT: 5000
      TC_HOST: 0.0.0.0
      RESAMPLING_METHOD: linear
    volumes:
      - ./data/cogs:/app/data/cogs:ro
      - tcdb:/app/tc_db
      - tc_tmp:/tmp
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 15
    networks: [web]
    logging: *logging
    restart: unless-stopped
    mem_limit: 768m        # host has 7.8 GB RAM; architecture review 2026-10-11, finding 8
    memswap_limit: 1g

  api:
    build:
         context: ./services/api
    env_file:
      - .env
    environment:
      POSTGRES_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgis:5432/${POSTGRES_DB}
      TERRACOTTA_URL: ${TERRACOTTA_URL}
      COG_DATA_DIR: /app/data/cogs          # same mount as terracotta; /api/raster/sample reads it
      DEFAULT_DEMS: ${DEFAULT_DEMS}
      SLOPE_LAYER: ${SLOPE_LAYER}
      HAND_LAYER: ${HAND_LAYER}
    depends_on:
      postgis:
        condition: service_healthy
      terracotta:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # назовні — через nginx /api/
    networks: [web]
    logging: *logging
    volumes:
      - ./data/parquet:/app/data/parquet:ro   # <-- тут твій layers_index.json
      - ./data/cogs:/app/data/cogs:ro         # <-- щоб Dash читав GeoTIFF
      - tc_tmp:/tmp
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m      # only /api/raster/sample is used by v2 (RSS ~20 MB); was 1g (server audit 2026-10-13)
    memswap_limit: 512m



  # Legacy v1 explorer (/dem/): retired 2026-10-13 (0 requests in 72 h, 1.5 GB limit, 0.5 GB in swap).
  # Not started by `docker compose up`; bring it back with `docker compose --profile legacy up -d dash`
  # and the nginx /dem/ block from git history.
  dash:
     profiles: [legacy]
     build:
       context: ./services/dash
       target: dash
     env_file:
       - .env
     environment:
       API_URL: http://api:8000
       MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
       TERRACOTTA_PUBLIC_URL: https://geohydroai.org/tc
       LOG_LEVEL: DEBUG
       DATA_DIR: /app/data/parquet
     depends_on:
       api:
         condition: service_started
     ports:
       - "127.0.0.1:${DASH_PORT:-8050}:8050"   # назовні — через nginx /dem/
     restart: unless-stopped
     mem_limit: 1536m        # host has 7.8 GB RAM; architecture review 2026-10-11, finding 8
     memswap_limit: 2g
     healthcheck:
       test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8050/health', timeout=2).read()" ]
       interval: 30s
       timeout: 5s
       retries: 6
     networks: [web]
     logging: *logging
     volumes:
       - ./data/parquet:/app/data/parquet:ro   # <-- тут твій layers_index.json
       - ./data/cogs:/app/data/cogs:ro         # <-- щоб Dash читав GeoTIFF
       - tc_tmp:/tmp

  nginx:
    image: nginx:stable
    container_name: geoai-nginx
    # без цього nginx може стартувати раніше за upstream'и і впасти з "host not found"
    depends_on: [api, terracotta]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # the whole directory, not the single file: a single-file bind mount pins the inode, so after
      # `git reset --hard` replaced nginx.conf the container kept serving the old copy
      - ./services/nginx:/etc/nginx/geoai:ro
      # secrets kept outside git, pulled in by `include` (catalog X-API-Key); see services/nginx/nginx.conf
      - /home/ubuntu/geoai-catalog/nginx:/etc/nginx/secrets/catalog:ro
      - ./certbot/www:/var/www/certbot:ro
      - certs:/etc/letsencrypt:ro
      - /var/www/geoai-front:/var/www/geoai-front:ro
      - /var/www/geoai-reports:/var/www/geoai-reports:ro

    # nginx не перечитує сертифікати сам: reload кожні 6 год підхоплює оновлені certbot-renewer'ом
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -c /etc/nginx/geoai/nginx.conf -s reload; done & exec nginx -c /etc/nginx/geoai/nginx.conf -g 'daemon off;'"]
    restart: unless-stopped
    oom_score_adj: -1000   # never the first to go under memory pressure
    mem_limit: 256m        # host has 7.8 GB RAM; architecture review 2026-10-11, finding 8
    memswap_limit: 384m
    networks: [web, python_course]
    logging: *logging


  # одноразовий запуск для випуску серта (ручний запуск командою нижче)
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot
      - certs:/etc/letsencrypt
    networks: [ web ]
    logging: *logging
    profiles: [manual]


  certbot-renewer:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot
      - certs:/etc/letsencrypt
    # reload nginx робить сам nginx (див. command у сервісі nginx)
    entrypoint: >
      /bin/sh -c '
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet
        sleep 12h
      done'
    restart: unless-stopped
    networks: [web]
    logging: *logging


    # Команди запускатимеш вручну через `docker compose run --rm certbot ...`

volumes:
  pgdata:
  certs:
  tcdb:
  tc_tmp:

networks:
  web: {}
  # мережа проєкту Python_Curse — nginx проксує python-course на web:9000
  python_course:
    external: true
    name: python_curse_default
