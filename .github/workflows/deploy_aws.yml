# GeoHydroAI-V2 infra (nginx, Terracotta, PostGIS, certbot) -> the EC2 server, compose project `geoai` in /home/ubuntu/geoai.
#
# 1. build  — self-hosted runner on Hetzner (label `hetzner`): the Terracotta image (services/tc_app) -> ghcr.io/<owner>/geoai-terracotta:<sha> (+ :latest).
#             Nothing is built on the production host any more (server audit 2026-10-13).
# 2. deploy-staging — Hetzner, the production server since the DNS switch of 2026-10-21 (the job keeps its name).
#    The former job `deploy` to the AWS EC2 server is removed (2026-10-23): see below.
name: Deploy (self-hosted)

on:
  push:
    branches: [ "main" ]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: deploy-geoai
  cancel-in-progress: false

env:
  IMAGE: geoai-terracotta
  REGISTRY: ghcr.io

jobs:
  # self-hosted on Hetzner (8 vCPU) since 2026-10-21: GitHub-hosted minutes cost money on this private repo
  build:
    runs-on: [hetzner]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/tc_app
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  # No deploy to the AWS server any more (owner, 2026-10-23): geohydroai.org runs on Hetzner, and the AWS nginx now also
  # serves klinmind.com and the Python course through a server-local include that `git reset --hard` there would wipe.
  # The AWS copy of this stack is left as it is until it is decommissioned; its GeoHydroAI-V2 runner is stopped.

  # Hetzner staging (staging.geohydroai.org) during the move (2026-10-21). /home/ubuntu/geoai there is not a git clone:
  # the tracked files of this commit are synced over it (untracked .env, data/, certbot/ stay). nginx runs ON THE HOST
  # there (owner, 2026-10-21): scripts/ops/host_nginx.py writes services/nginx-host/nginx.conf, which
  # /etc/nginx/nginx.conf includes; a systemd path unit (geohydroai-nginx-reload.path) tests and reloads nginx when it
  # changes, so the runner (label `hetzner`, no sudo) never needs root. Only postgis and terracotta run from this project.
  deploy-staging:
    needs: build
    runs-on: [hetzner]
    timeout-minutes: 30
    env:
      # the site Hetzner serves: staging.geohydroai.org until the DNS switch, then geohydroai.org (repo variable)
      NGINX_HOST: ${{ vars.HETZNER_NGINX_HOST || 'staging.geohydroai.org' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to /home/ubuntu/geoai (staging)
        run: |
          set -euo pipefail
          git archive --format=tar HEAD | tar xf - -C /home/ubuntu/geoai
          cd /home/ubuntu/geoai
          python3 scripts/ops/host_nginx.py --host "$NGINX_HOST" --root .
          REMOTE="${{ needs.build.outputs.image }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          docker pull "$REMOTE:$GITHUB_SHA"
          docker logout "$REGISTRY" || true
          docker image inspect "$IMAGE:latest" >/dev/null 2>&1 && docker image tag "$IMAGE:latest" "$IMAGE:previous" || true
          docker image tag "$REMOTE:$GITHUB_SHA" "$IMAGE:latest"
          docker image rm "$REMOTE:$GITHUB_SHA" >/dev/null 2>&1 || true
          C="docker compose -f docker-compose.yml -f docker-compose.staging.yml"
          $C up -d --no-build postgis terracotta
          sleep 5   # the path unit reloads the host nginx when nginx-host/nginx.conf changed
          systemctl is-active --quiet nginx || { echo "::error::host nginx is not running (journalctl -u geohydroai-nginx-reload)"; exit 1; }
          docker exec -i geoai-terracotta-1 python - < services/tc_app/scripts/raster_versions.py > /tmp/raster-versions.json
          install -m 644 /tmp/raster-versions.json /var/www/geoai-front/raster-versions.json
          curl -fsS --retry 5 --retry-delay 4 --retry-all-errors -o /dev/null "https://$NGINX_HOST/"
          docker image prune -f || true
