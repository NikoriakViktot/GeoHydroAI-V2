name: Deploy (self-hosted)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Deploy from /home/ubuntu/geoai
        run: |
          set -e
          cd /home/ubuntu/geoai
          # оновити код з GitHub
          git fetch --all
          git reset --hard origin/main
          # перевірка що compose-файл є тут
          ls -la docker-compose.yml
          # деплой
          docker compose -f docker-compose.yml pull || true
          docker compose -f docker-compose.yml up -d
          # compose does not recreate nginx when only nginx.conf changed: check it, then reload.
          # A broken config fails the deploy here and nginx keeps running the previous one.
          docker exec geoai-nginx nginx -c /etc/nginx/geoai/nginx.conf -t
          docker exec geoai-nginx nginx -c /etc/nginx/geoai/nginx.conf -s reload
          docker image prune -f || true

