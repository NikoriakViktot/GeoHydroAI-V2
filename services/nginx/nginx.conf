# One worker per CPU, and room for bursts of map tiles. With the defaults (an empty `events {}`: 1 worker, 512
# connections) a single user zooming into a dense area (≈ 10 vector layers × dozens of tiles, each holding a client and
# an upstream connection) exhausted the worker on 2026-10-20 07:17-07:19 UTC: "512 worker_connections are not
# enough while connecting to upstream", 500 / timeouts on /tiles, empty map.
worker_processes auto;
worker_rlimit_nofile 16384;

events {
  worker_connections 4096;
}

http {

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Compress text responses: the map bundles (maplibre, deck.gl) are ~2.6 MB raw, ~0.73 MB gzipped.
  # PNG/WebP tiles are already compressed and are not listed. Upstreams that already send
  # Content-Encoding (e.g. Martin) are passed through untouched.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css text/plain text/xml application/javascript text/javascript application/json
             application/geo+json application/xml image/svg+xml application/manifest+json
             application/x-protobuf application/vnd.mapbox-vector-tile;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  resolver 127.0.0.11 valid=30s ipv6=off;

  # Terracotta tile cache: tiles are rendered on demand (~0.5 s each) and sent with no-cache,
  # so without this every pan/zoom re-renders them. Tiles for a given URL never change.
  # Raster tiles whose URL carries a data version (?v=, from /raster-versions.json) never change: browsers may
  # keep them for a year. Unversioned URLs keep the short lifetime.
  # Only a 200 tile may be cached long; an error (404, 429 from limit_req, 502 while Terracotta restarts) must never be:
  # until 2026-10-13 the header went out with `always` on errors too, and browsers kept bad tiles for a year.
  map "$status:$arg_v" $tc_cache_control {
    "~^200:$"   "public, max-age=86400";
    "~^200:.+"  "public, max-age=31536000, immutable";
    default     "no-store";
  }

  proxy_cache_path /var/cache/nginx/tc levels=1:2 keys_zone=tc_cache:50m max_size=5g inactive=30d use_temp_path=off;
  # Martin vector tiles (reference layers): every tile used to go to PostGIS. A short cache with stale-while-
  # revalidate keeps them fast; reloading a layer shows up within 10 minutes (or clear /var/cache/nginx/tiles).
  proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles_cache:20m max_size=2g inactive=7d use_temp_path=off;
  limit_req_zone $binary_remote_addr zone=tc_rate:10m rate=40r/s;
  # public paper catalog: a page load makes a handful of calls, search typing a few per second
  limit_req_zone $binary_remote_addr zone=catalog_rate:10m rate=10r/s;

  server_tokens off;

  upstream terracotta_upstream {
      zone terracotta 64k;
      server terracotta:5000 resolve;
      keepalive 64;
  }

#    upstream python_course_upstream {
#        zone python_course 64k;
#        server web:9000 resolve;
#        keepalive 32;
#    }
##################################################
# GEOHYDROAI HTTP
##################################################

 server {
    listen 80;
    server_name geohydroai.org www.geohydroai.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

##################################################
# GEOHYDROAI HTTPS
##################################################

  server {

    listen 443 ssl http2;
    server_name geohydroai.org www.geohydroai.org;

    ssl_certificate /etc/letsencrypt/live/www.geohydroai.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.geohydroai.org/privkey.pem;
    # resume TLS sessions: without a session cache every new connection paid a full handshake (~0.5 s measured
    # from Ukraine, 130 ms RTT to us-east-1) before the first tile
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;     # the shared session cache is enough; tickets would need key rotation

    root /var/www/geoai-front/current;
    index index.html;

    # tight defaults: anonymous clients could otherwise stream 2 GB into any location on a 91 %-full disk
    # (server audit 2026-10-13); uploads raise the limit in their own location (/api/v1/ 50m)
    client_max_body_size 10m;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # security headers; locations that set their own add_header repeat the include (nginx inherits add_header
    # only from the nearest level that defines any)
    include /etc/nginx/geoai/security_headers.conf;

    proxy_buffering off;
    proxy_request_buffering off;

    # Блокуємо приховані файли (.env, .git тощо) для всіх шляхів, включно з ^~ локаціями
    if ($request_uri ~* "/\.(?!well-known/)") {
      return 404;
    }

##################################################
# DASH (legacy v1 explorer, retired 2026-10-13: 0 requests in 72 h; the container is under compose profile `legacy`)
##################################################

    location ^~ /dem { return 302 /; }
    location ~ ^/_dash- { return 404; }

##################################################
# API
##################################################

##################################################
# GEOHYDROAI PLATFORM CORE (geoai-django: /api/v1, /api/schema, /api/docs) -> container platform-api
# Insert into the `listen 443` server block of geohydroai.org in GeoHydroAI-V2 services/nginx/nginx.conf,
# ABOVE `location ^~ /api/` (longest prefix wins anyway; geoai-api has no /api/v1 routes).
# Variable upstream + the http-level `resolver 127.0.0.11` keep geoai-nginx starting when platform-api is down.
##################################################

##################################################
# GEOAI FRONTEND V2 (SPA, live mode against /api/v1) at https://geohydroai.org/app/
# Built with VITE_BASE=/app/ VITE_API_MODE=live; releases in /var/www/geoai-front/v2/releases/<ts>/app/,
# /var/www/geoai-front/v2/current -> active release (inside the existing /var/www/geoai-front mount).
# Insert into the `listen 443` server block of geohydroai.org.
##################################################

    location = /app {
      return 301 /app/;
    }

    location = /app/index.html {
      root /var/www/geoai-front/v2/current;
      add_header Cache-Control "no-cache";
      include /etc/nginx/geoai/security_headers.conf;
    }

    location ^~ /app/assets/ {
      root /var/www/geoai-front/v2/current;
      add_header Cache-Control "public, max-age=31536000, immutable";
      include /etc/nginx/geoai/security_headers.conf;
    }

    location ^~ /app/ {
      root /var/www/geoai-front/v2/current;
      try_files $uri /app/index.html;
    }

    location ^~ /api/v1/internal/ {
      return 403;                       # service-to-service callbacks stay on the docker network
    }

    location ^~ /api/v1/ {
      set $platform_upstream http://platform-api:8000;
      proxy_pass $platform_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
      client_max_body_size 50m;         # yearbook uploads
      error_page 502 504 = @api_busy;
    }

    # The API did not answer (502: platform-api down or restarting; 504: no answer in proxy_read_timeout while the
    # 2-vCPU server runs a model, a data load or CI). nginx answers for it with a JSON stub the SPA understands
    # (`code: server_busy` → «Сервер зайнятий розрахунками» banner that goes with the first answer that gets through).
    # Only nginx's own 502/504: Django's responses, its 503 from Hydro included, pass unchanged (no proxy_intercept_errors).
    location @api_busy {
      default_type application/json;
      charset utf-8;
      add_header Retry-After 30 always;
      add_header Cache-Control "no-store" always;
      include /etc/nginx/geoai/security_headers.conf;
      return 503 '{"detail":"Сервер зайнятий розрахунками (моделювання або завантаження даних). Спробуйте за хвилину.","code":"server_busy"}';
    }

    # Lab book uploads (/api/v1/labs/<lab>/books, batches up to 50 MB): nginx takes the whole body first and hands it
    # to Django in one go. Unbuffered, a slow uplink streamed a 30 MB batch into a sync gunicorn worker for over 60 s and
    # gunicorn killed it (WORKER TIMEOUT → HTTP 500, 2026-10-19), holding one of the three workers all that time.
    location ^~ /api/v1/labs/ {
      set $platform_upstream http://platform-api:8000;
      proxy_pass $platform_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_request_buffering on;
      client_body_buffer_size 1m;       # larger bodies go to a temp file, deleted after the request
      client_body_timeout 120s;         # between two reads from the client, not for the whole upload
      proxy_read_timeout 120s;
      client_max_body_size 50m;
      error_page 502 504 = @api_busy;
    }

    location = /api/schema {
      set $platform_upstream http://platform-api:8000;
      proxy_pass $platform_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/docs {
      set $platform_upstream http://platform-api:8000;
      proxy_pass $platform_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # geoai-api v1 retired 2026-10-13: its last live route (/api/raster/sample) moved to hydro-api
    # (/v1/hydro/raster/sample, proxied by the platform as /api/v1/raster/sample). Nothing else called /api/*.
    location ^~ /api/ { return 410; }

##################################################
# HYDRO DATA SERVICE (data_dnipro_h_q: /v1/hydro incl. /v1/hydro/docs, /llms.txt, /llms-full.txt) -> container hydro-api
# Insert into the `listen 443` server block of geohydroai.org in GeoHydroAI-V2 services/nginx/nginx.conf.
# Variables + the http-level `resolver 127.0.0.11` make nginx resolve hydro-api per request, so geoai-nginx
# still starts when hydro-api is down (requests then get 502 instead of the whole site failing).
##################################################

    location ^~ /v1/hydro/admin/ {
      return 403;                       # yearbook uploads run on the workstation, never on this server
    }

    location ^~ /v1/hydro {
      set $hydro_upstream http://hydro-api:8000;
      proxy_pass $hydro_upstream;
      proxy_read_timeout 120s;
      client_max_body_size 2m;
    }

    location ~ ^/llms(-full)?\.txt$ {     # agent guide; /llms-full.txt = guide + every endpoint
      set $hydro_upstream http://hydro-api:8000;
      proxy_pass $hydro_upstream;
    }

    # HYDRO VECTOR TILES (Martin, container hydro-tiles, ~/hydro/deploy/server/docker-compose.tiles.yml):
    # /tiles/catalog, /tiles/<source> (TileJSON), /tiles/<source>/{z}/{x}/{y} (MVT) from PostGIS geohydro.hydro
    location ^~ /tiles/ {
      set $tiles_upstream http://hydro-tiles:3000;
      rewrite ^/tiles/(.*)$ /$1 break;
      proxy_pass $tiles_upstream;
      proxy_set_header Host $host;
      proxy_read_timeout 60s;
      # Martin serves only public reference layers (no auth, no per-user content: every function of schema hydro),
      # so one shared cache is safe. Still, never store or serve from cache a request that carries credentials.
      proxy_buffering on;               # caching needs buffering (this server block turns it off)
      proxy_cache tiles_cache;
      proxy_cache_key "$uri$is_args$args";
      proxy_cache_valid 200 204 10m;    # successes only: errors are never cached
      proxy_cache_bypass $http_authorization $cookie_ghai_refresh;
      proxy_no_cache $http_authorization $cookie_ghai_refresh;
      proxy_ignore_headers Set-Cookie;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      proxy_cache_lock on;
      add_header X-Cache-Status $upstream_cache_status always;
      add_header Cache-Control "public, max-age=3600" always;
      include /etc/nginx/geoai/security_headers.conf;
    }


##################################################
# GEOHYDROAI PAPER CATALOG (src/catalog/api.py) at https://geohydroai.org/catalog/ -> container catalog-api
# Insert into the `listen 443` server block of geohydroai.org in GeoHydroAI-V2 services/nginx/nginx.conf.
# Variable upstream + the http-level `resolver 127.0.0.11` keep geoai-nginx starting when catalog-api is down.
# Reload: docker exec geoai-nginx nginx -t && docker exec geoai-nginx nginx -s reload
##################################################
    # Ops dashboard (services/ops): server state, workers, logs, start / stop of the allowed workers. Basic auth; the
    # user file lives outside git (/home/ubuntu/geoai-ops/nginx → /etc/nginx/secrets/ops). No file = nobody gets in.
    location = /ops { return 301 /ops/; }
    location ^~ /ops/ {
      auth_basic "GeoHydroAI ops";
      auth_basic_user_file /etc/nginx/secrets/ops/htpasswd;
      set $ops_upstream http://geoai-ops:8501;
      proxy_pass $ops_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;       # Streamlit talks over a WebSocket (/ops/_stcore/stream)
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Remote-User $remote_user;  # who did what, in the page's action log
      proxy_read_timeout 1h;
      client_max_body_size 1m;
    }

    location = /catalog { return 301 /catalog/; }

    location ^~ /catalog/ {
      # Public, read-only: only the endpoints the site uses. Everything else under /catalog/
      # (agent guide, llms.txt, anything added later) stays internal.
      location ~ ^/catalog/(v1/(cards|facets|release)(/.*)?|health)$ {
        limit_except GET HEAD { deny all; }
        limit_req zone=catalog_rate burst=30 nodelay;
        limit_req_status 429;
        set $catalog_upstream http://catalog-api:8095;
        rewrite ^/catalog/(.*)$ /$1 break;
        proxy_pass $catalog_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # X-API-Key for catalog-api: a secret kept outside git (/home/ubuntu/geoai-catalog/nginx,
        # mounted by docker-compose). Browsers never see it. No file = no key = catalog answers 401.
        include /etc/nginx/secrets/catalog/*.conf;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
      }
      return 404;
    }

##################################################
# TERRACOTTA
##################################################

    location ^~ /tc/ {
      proxy_pass http://terracotta_upstream/;
    }

    # tile endpoints are cached; metadata (/tc/keys, /tc/datasets, /tc/metadata) stays live
    location ^~ /tc/singleband/ {
      proxy_pass http://terracotta_upstream/singleband/;
      proxy_buffering on;               # caching needs buffering (this server block turns it off)
      proxy_cache tc_cache;
      proxy_cache_key $request_uri;
      proxy_cache_valid 200 30d;
      proxy_cache_valid 404 1m;
      proxy_cache_lock on;              # one render per tile, concurrent requests wait for it
      proxy_cache_lock_timeout 30s;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_ignore_headers Cache-Control Expires Set-Cookie;
      proxy_hide_header Cache-Control;
      add_header Cache-Control $tc_cache_control always;
      include /etc/nginx/geoai/security_headers.conf;
      add_header X-Cache-Status $upstream_cache_status always;
      limit_req zone=tc_rate burst=80 nodelay;
      limit_req_status 429;
    }

    location ^~ /tc/rgb/ {
      proxy_pass http://terracotta_upstream/rgb/;
      proxy_buffering on;               # caching needs buffering (this server block turns it off)
      proxy_cache tc_cache;
      proxy_cache_key $request_uri;
      proxy_cache_valid 200 30d;
      proxy_cache_valid 404 1m;
      proxy_cache_lock on;              # one render per tile, concurrent requests wait for it
      proxy_cache_lock_timeout 30s;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_ignore_headers Cache-Control Expires Set-Cookie;
      proxy_hide_header Cache-Control;
      add_header Cache-Control $tc_cache_control always;
      include /etc/nginx/geoai/security_headers.conf;
      add_header X-Cache-Status $upstream_cache_status always;
      limit_req zone=tc_rate burst=80 nodelay;
      limit_req_status 429;
    }

##################################################
# REPORTS
##################################################

    location /reports/ {
      alias /var/www/geoai-reports/;
      try_files $uri $uri/ =404;
    }

##################################################
# SPA
##################################################

    location / {
      try_files $uri $uri/ /index.html;
    }

    # The SPA shell must be revalidated on every visit (cheap: 304 by etag), otherwise browsers keep a
    # heuristically cached index.html that points at the previous release's bundle. /assets/ files are
    # content-hashed and stay immutable below.
    location = /index.html {
      add_header Cache-Control "no-cache" always;
      include /etc/nginx/geoai/security_headers.conf;
    }

    # data version per raster category, written by the deploy (services/tc_app/scripts/raster_versions.py);
    # outside the frontend release dirs so a frontend deploy does not reset it
    location = /raster-versions.json {
      alias /var/www/geoai-front/raster-versions.json;
      default_type application/json;
      add_header Cache-Control "no-cache" always;
      include /etc/nginx/geoai/security_headers.conf;
    }

##################################################
# STATIC CACHE
##################################################

    location /assets/ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800, immutable";
      include /etc/nginx/geoai/security_headers.conf;
      access_log off;
    }

  }

##################################################
# PYTHON COURSE HTTP
##################################################

  server {

      listen 80;
      server_name python-course-viktor-nikoriak.org www.python-course-viktor-nikoriak.org;

      location ^~ /.well-known/acme-challenge/ {
          root /var/www/certbot;
      }

      location / {
          return 301 https://$host$request_uri;
      }

  }

##################################################
# PYTHON COURSE HTTPS
##################################################

    server {

        listen 443 ssl;
        server_name python-course-viktor-nikoriak.org www.python-course-viktor-nikoriak.org;

        ssl_certificate /etc/letsencrypt/live/python-course-viktor-nikoriak.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/python-course-viktor-nikoriak.org/privkey.pem;

        # Блокуємо приховані файли (.env, .git тощо) для всіх шляхів, включно з ^~ локаціями
        if ($request_uri ~* "/\.(?!well-known/)") {
          return 404;
        }

        location / {
            # змінна => DNS резолвиться під час запиту, nginx стартує навіть якщо web (інший compose-проєкт) лежить
            set $python_course_upstream http://web:9000;
            proxy_pass $python_course_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
